<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love 10 | Registrar venda</title><style>body{font:16px system-ui;background:#fff8f7;color:#482725;max-width:760px;margin:auto;padding:18px}section{background:white;border:1px solid #eadbd7;border-radius:15px;padding:20px;margin:14px 0}input,select,button{font:inherit;padding:12px;border-radius:9px;max-width:100%;box-sizing:border-box}input,select{width:100%;border:1px solid #d9c7c1;margin:7px 0 15px}button{border:0;background:#482725;color:white;cursor:pointer;margin:4px 0}button:disabled{opacity:.5}.muted{color:#79645e}.hidden{display:none}.line{padding:10px 0;border-bottom:1px solid #eee}.msg{background:#f6e4e4;padding:12px;border-radius:10px;white-space:pre-wrap}a{color:#482725}.product-list{display:grid;gap:8px;max-height:350px;overflow:auto;margin-bottom:14px}.product-choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;color:#482725;border:1px solid #eadbd7;padding:8px;border-radius:12px}.product-choice.selected{border:2px solid #482725;background:#fff0ee}.product-choice img,.product-placeholder{width:58px;height:58px;flex-shrink:0;object-fit:cover;border-radius:8px;background:#f7e8e6}.product-placeholder{display:grid;place-items:center;font-size:25px}.product-meta{display:flex;flex-direction:column;gap:3px}.product-meta small{color:#79645e}.selected-label{font-size:13px;color:#79645e;margin:0 0 10px}</style><h1>♡ Love 10 · Registrar venda</h1><p><a href="/admin.html">Cadastro de produtos</a> · <a href="/">Voltar à loja</a></p><section id="login"><h2>Entrar como administrador</h2><form id="loginForm"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" required><button>Entrar</button></form></section><main id="app" class="hidden"><button id="logout">Sair</button><section><h2>Nova venda</h2><label for="productSearch">Pesquisar produto</label><input id="productSearch" type="search" placeholder="Digite o nome do produto..." autocomplete="off"><div id="productList" class="product-list"></div><p id="selectedLabel" class="selected-label">Selecione um produto na lista.</p><label>Quantidade</label><input id="quantity" type="number" min="1" step="1" value="1"><button id="add">Adicionar item</button><div id="cart"></div><h2 id="total">Total: R$ 0,00</h2><label>Forma de pagamento</label><select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select><button id="confirm">Confirmar venda</button> <button id="clear">Limpar</button></section><section><h2>Histórico de vendas</h2><button id="refresh">Atualizar histórico</button><div id="history"></div></section></main><p id="message" class="msg hidden" role="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://gedhbajccsckzaswahgt.supabase.co','sb_publishable_9SKbpswJDW0wmpAeltIvWA_FhiZalcE');const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],cart=[],selectedProductId=null;function msg(s){$('message').textContent=s;$('message').classList.remove('hidden')}async function boot(){const {data:{user}}=await db.auth.getUser();let admin=false;if(user){const {data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();admin=!!data}$('login').classList.toggle('hidden',admin);$('app').classList.toggle('hidden',!admin);if(admin){await loadProducts();await loadHistory()}else if(user)msg('Esta conta não tem permissão administrativa.')}async function loadProducts(){const {data,error}=await db.from('products').select('id,name,price,stock,active,image_url').order('name');if(error)throw error;products=data||[];if(!products.some(p=>p.id===selectedProductId&&p.active&&p.stock>0))selectedProductId=null;renderProductList();render()}function renderProductList(){const term=$('productSearch').value.trim().toLocaleLowerCase('pt-BR');const visible=products.filter(p=>p.active&&p.stock>0&&p.name.toLocaleLowerCase('pt-BR').includes(term));$('productList').innerHTML=visible.length?visible.map(p=>'<button type="button" class="product-choice'+(p.id===selectedProductId?' selected':'')+'" data-product-id="'+p.id+'">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="" loading="lazy">':'<span class="product-placeholder">♡</span>')+'<span class="product-meta"><strong>'+esc(p.name)+'</strong><small>'+money(p.price)+' · '+p.stock+' disponíveis</small></span></button>').join(''):'<p class="muted">Nenhum produto encontrado.</p>';const selected=products.find(p=>p.id===selectedProductId);$('selectedLabel').textContent=selected?'Selecionado: '+selected.name:'Selecione um produto na lista.'}$('productSearch').addEventListener('input',renderProductList);$('productList').addEventListener('click',e=>{const btn=e.target.closest('[data-product-id]');if(!btn)return;selectedProductId=Number(btn.dataset.productId);renderProductList()});function render(){$('cart').innerHTML=cart.length?cart.map((x,i)=>{const p=products.find(p=>p.id===x.product_id);return '<div class="line">'+esc(p?.name)+' × '+x.quantity+' — '+money(Number(p?.price||0)*x.quantity)+' <button onclick="removeItem('+i+')">Remover</button></div>'}).join(''):'<p class="muted">Nenhum item na venda.</p>';$('total').textContent='Total: '+money(cart.reduce((sum,x)=>sum+Number(products.find(p=>p.id===x.product_id)?.price||0)*x.quantity,0))}function removeItem(i){cart.splice(i,1);render()}$('add').onclick=()=>{const id=selectedProductId,q=Number($('quantity').value),p=products.find(p=>p.id===id);if(!p||!Number.isInteger(q)||q<1)return msg('Produto ou quantidade inválidos.');const existing=cart.find(x=>x.product_id===id);if((existing?.quantity||0)+q>p.stock)return msg('Estoque insuficiente.');if(existing)existing.quantity+=q;else cart.push({product_id:id,quantity:q});render()};$('clear').onclick=()=>{cart=[];render()};$('confirm').onclick=async()=>{if(!cart.length)return msg('Adicione pelo menos um produto.');if(!confirm('Confirmar esta venda e descontar os itens do estoque?'))return;const b=$('confirm');b.disabled=true;try{const {data,error}=await db.rpc('register_store_sale',{p_items:cart,p_payment_method:$('payment').value});if(error)throw error;cart=[];await loadProducts();await loadHistory();msg('Venda nº '+data+' registrada. Estoque atualizado!')}catch(e){msg('Erro: '+e.message)}finally{b.disabled=false}};$('refresh').onclick=loadHistory;async function loadHistory(){const {data,error}=await db.from('sales').select('id,created_at,payment_method,total,sale_items(product_name,quantity)').order('created_at',{ascending:false}).limit(100);if(error)return msg('Erro ao consultar vendas: '+error.message);$('history').innerHTML=data.length?data.map(s=>'<div class="line"><strong>Venda '+s.id+' · '+money(s.total)+'</strong><div class="muted">'+new Date(s.created_at).toLocaleString('pt-BR')+' · '+esc(s.payment_method)+'</div>'+s.sale_items.map(i=>'<div>'+esc(i.product_name)+' × '+i.quantity+'</div>').join('')+'</div>').join(''):'<p class="muted">Nenhuma venda registrada.</p>'}$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message);$('message').classList.add('hidden');await boot()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};boot();
</script></html>
